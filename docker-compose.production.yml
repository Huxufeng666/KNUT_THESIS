services:
  knut-thesis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knut-thesis-studio
    restart: unless-stopped
    entrypoint: ["node"]
    command: ["local-app/production-server.mjs"]
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
    volumes:
      - knut-user-data:/var/lib/knut-thesis
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 4g
    cpus: 2.0

volumes:
  knut-user-data:
